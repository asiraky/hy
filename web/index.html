<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget keeps the layout viewport from being shrunk by the
         on-screen keyboard, so the composer stays put instead of being pushed
         off-screen. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#09090b" />
    <!-- Stamped with the bundle's content hash when the Go server serves this
         document. It stays "dev" under the Vite dev server, which is how the
         client knows to skip build-mismatch checks during development. -->
    <meta name="omniplex-build" content="dev" />
    <title>Omniplex</title>
    <!-- Runs before the first paint, so the page is never briefly the wrong
         colour while the bundle loads. The key and the three values are the
         ones in src/lib/theme.ts; the two have to agree. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("omniplex.theme");
          var theme = stored === "light" || stored === "dark" ? stored : null;
          var dark = theme
            ? theme === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* Private-mode storage can throw. The default class stands. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
